name: Release

# Uma tag v* (git tag v0.8.0 && git push --tags) gera os pacotes e:
# - anexa o .vsix e o .zip do plugin JetBrains à release da tag no GitHub (cria a release se não existir);
# - publica o .vsix no Open VSX, de onde Cursor, Windsurf, VSCodium e Antigravity instalam.
#   Precisa do segredo OVSX_PAT, um token de open-vsx.org com acesso ao namespace "code-scope";
#   sem ele, esse passo é pulado.
# - publica no Marketplace do VS Code (segredo VSCE_PAT) e no da JetBrains (segredo JETBRAINS_TOKEN),
#   também só quando o segredo existe.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Pacotes da release
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run vsix
      - run: ./gradlew buildPlugin --console=plain
        working-directory: jetbrains
      - name: Anexa os pacotes à release do GitHub
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Veja o CHANGELOG.md." --prerelease
          gh release upload "$tag" code-scope.vsix jetbrains/build/distributions/*.zip --clobber
      - name: Publica no Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish code-scope.vsix
      # Marketplace do VS Code: token do Azure DevOps com escopo Marketplace (Manage) para o publisher "code-scope".
      - name: Publica no Marketplace do VS Code
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath code-scope.vsix
      # Marketplace da JetBrains: a primeira versão sobe pelo site; daqui em diante, pelo token.
      - name: Publica no Marketplace da JetBrains
        if: env.JETBRAINS_TOKEN != ''
        run: ./gradlew publishPlugin --console=plain
        working-directory: jetbrains
