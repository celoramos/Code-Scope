name: Programas reais

# Programas de repositórios abertos (TheAlgorithms) rodados no debugger real, um por caso de
# test/reais/casos.json, do começo ao fim. Um job por linguagem, em paralelo. Os dumps do que o painel
# desenhou ficam no artefato, para conferir à mão.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # O código da extensão também: foi este workflow que pegou o valor devolvido do Java e a pilha
    # de cabeça para baixo, que os testes de integração não pegaram.
    paths:
      - src/**
      - test/integration/helpers.ts
      - test/reais/**
      - test/integration/reais.itest.ts
      - test/corpus/**
      - .github/workflows/reais.yml

# O job roda código baixado de fora: o token só lê, e o checkout não deixa a credencial no .git.
permissions:
  contents: read

jobs:
  reais:
    name: Programas reais (${{ matrix.lang }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A maioria de quem aprende usa Windows: os mesmos programas rodam nos três sistemas.
        os: [ubuntu-latest, windows-latest, macos-latest]
        lang: [Python, Java, JavaScript]
        include:
          - lang: Python
            grep: 'Reais py-'
            ext: ms-python.debugpy
          - lang: Java
            grep: 'Reais java-'
            ext: vscjava.vscode-java-pack
          - lang: JavaScript
            grep: 'Reais js-'
            ext: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - run: npm ci
      # Antes de abrir o VS Code: o language server do Java precisa achar as classes baixadas.
      - run: node test/reais/preparar.mjs
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:integration 2>&1 | tee itest.log
        shell: bash
        env:
          CODE_SCOPE_PYTHON: ${{ steps.python.outputs.python-path }}
          CODE_SCOPE_GREP: ${{ matrix.grep }}
          # Os programas do corpus vão além dos baixados: até 1500 F11 por programa.
          CODE_SCOPE_REAIS_PASSOS: 1500
          # Vazio instala nada: o debugger de JavaScript vem no VS Code.
          CODE_SCOPE_EXTENSIONS: ${{ matrix.ext }}
      - if: always()
        run: grep -E "^REAIS |^INVISIVEIS |passing|failing|pending" itest.log || true
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reais-${{ matrix.lang }}-${{ matrix.os }}
          path: |
            itest.log
            out-test/reais-*.json
          if-no-files-found: warn
