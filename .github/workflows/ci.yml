name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Compilação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run vsix
      - uses: actions/upload-artifact@v7
        with:
          name: code-scope-vsix
          path: code-scope.vsix

  integration:
    name: Integração com os debuggers reais (${{ matrix.name }})
    # Todas as linguagens nos três sistemas. O C precisa de gcc e gdb: o macOS não tem gdb,
    # então lá o runTest.ts não instala a extensão C/C++ e os testes de C são pulados.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      # C#: a extensão C# debuga com o .NET do PATH. C: os testes usam o gcc e o gdb do runner, se houver.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb
      - run: npm ci
      # O VS Code precisa de uma tela; no Linux ela é virtual.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:integration 2>&1 | tee itest.log
        shell: bash
        env:
          CODE_SCOPE_PYTHON: ${{ steps.python.outputs.python-path }}
      # O log do job só abre com login no GitHub; anotações qualquer um vê na página do run.
      # Resumo: quantos testes passaram por linguagem, os pulados e o nome de cada falha.
      - if: always()
        shell: bash
        run: |
          [ -f itest.log ] || exit 0
          # Cada describe do mocha começa na coluna 2 ("Java Debugger real"); a descoberta de formatos sempre pula.
          per=$(awk '/^  [A-Z]/ && !/DISCOVER/ {s=$0; sub(/^ +/, "", s); o[++k]=s} /DISCOVER/ {s=""}
            s != "" && /^ +(✔|√|✓) / {n[s]++} s != "" && /^ +- / {p[s]++}
            END {for (i = 1; i <= k; i++) printf "%s: %d ok, %d pulados. ", o[i], n[o[i]], p[o[i]]}' itest.log)
          total=$(grep -oE '[0-9]+ (passing|failing|pending)' itest.log | paste -sd ',' -)
          echo "::notice title=Integração (${{ matrix.name }})::${total}. ${per}"
          grep -E 'testes pulados' itest.log | sort -u | sed 's/^/::warning::/' || true
          grep -E -A1 '^ +[0-9]+\) ' itest.log | grep -vE '^--$' | paste -d ' ' - - | head -10 | sed 's/^ */::error::/' || true

  minimum:
    name: Integração no VS Code 1.95
    # A versão mínima do engines, com o debugger de JavaScript que vem com o VS Code.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          CODE_SCOPE_GREP: JavaScript
          CODE_SCOPE_EXTENSIONS: ''
          CODE_SCOPE_VSCODE: 1.95.0
