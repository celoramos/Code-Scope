name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Compilação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: code-scope-vsix
          path: code-scope.vsix

  integration:
    name: Integração com o Java Debugger
    # Windows é onde o teste foi validado e não precisa de servidor X para abrir o VS Code.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:integration
