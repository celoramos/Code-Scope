name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Compilação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run vsix
      - uses: actions/upload-artifact@v7
        with:
          name: code-scope-vsix
          path: code-scope.vsix

  integration:
    name: Integração com os debuggers reais
    # Windows é onde o teste foi validado e não precisa de servidor X para abrir o VS Code.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      # C#: a extensão C# debuga com o .NET do PATH. C: os testes usam o gcc e o gdb do runner, se houver.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run test:integration
        env:
          CODE_SCOPE_PYTHON: ${{ steps.python.outputs.python-path }}
