name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Compilação e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run vsix
      - uses: actions/upload-artifact@v7
        with:
          name: code-scope-vsix
          path: code-scope.vsix

  integration:
    name: Integração com os debuggers reais (${{ matrix.name }})
    # Todas as linguagens nos três sistemas. O C precisa de gcc e gdb: o macOS não tem gdb,
    # então lá o runTest.ts não instala a extensão C/C++ e os testes de C são pulados.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      # C#: a extensão C# debuga com o .NET do PATH. C: os testes usam o gcc e o gdb do runner, se houver.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdb
      - run: npm ci
      # O VS Code precisa de uma tela; no Linux ela é virtual.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:integration 2>&1 | tee itest.log
        shell: bash
        env:
          CODE_SCOPE_PYTHON: ${{ steps.python.outputs.python-path }}
      # O log do job só abre com login no GitHub; anotações qualquer um vê na página do run.
      # Resumo: quantos testes passaram por linguagem, os pulados e o nome de cada falha.
      - if: always()
        shell: bash
        run: |
          [ -f itest.log ] || exit 0
          # Cada describe do mocha começa na coluna 2 ("Java Debugger real"); a descoberta de formatos sempre pula.
          per=$(awk '/^  [A-Z]/ && !/DISCOVER/ {s=$0; sub(/^ +/, "", s); o[++k]=s} /DISCOVER/ {s=""}
            s != "" && /^ +(✔|√|✓) / {n[s]++} s != "" && /^ +- / {p[s]++}
            END {for (i = 1; i <= k; i++) printf "%s: %d ok, %d pulados. ", o[i], n[o[i]], p[o[i]]}' itest.log)
          total=$(grep -oE '[0-9]+ (passing|failing|pending)' itest.log | paste -sd ',' -)
          echo "::notice title=Integração (${{ matrix.name }})::${total}. ${per}"
          grep -E 'testes pulados' itest.log | sort -u | sed 's/^/::warning::/' || true
          grep -E -A1 '^ +[0-9]+\) ' itest.log | grep -vE '^--$' | paste -d ' ' - - | head -10 | sed 's/^ */::error::/' || true

  vscodium:
    name: Integração no VSCodium (Open VSX)
    # Forks do VS Code (VSCodium, Cursor, Windsurf, Antigravity) instalam extensões do Open VSX.
    # O VSCodium é o fork aberto: se Java, Python e JavaScript passam nele, com os debuggers
    # baixados do Open VSX, o mesmo .vsix serve nos outros.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Baixa o VSCodium mais recente
        run: |
          gh release download --repo VSCodium/vscodium --pattern 'VSCodium-linux-x64-*.tar.gz' --output codium.tar.gz
          mkdir -p .vscode-test/vscodium
          tar -xzf codium.tar.gz -C .vscode-test/vscodium
          echo "CODE_SCOPE_EXECUTABLE=$PWD/.vscode-test/vscodium/codium" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
        env:
          CODE_SCOPE_PYTHON: ${{ steps.python.outputs.python-path }}
          CODE_SCOPE_GREP: 'Java Debugger|JavaScript|Python'
          CODE_SCOPE_EXTENSIONS: vscjava.vscode-java-pack,ms-python.debugpy

  jetbrains:
    name: Plugin JetBrains (IntelliJ IDEA, Android Studio)
    # O plugin leva o painel e o núcleo em TypeScript dentro (jetbrains/bundle-panel.ts),
    # então o Node entra junto. O Gradle baixa o IntelliJ IDEA da versão em gradle.properties.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: ./gradlew buildPlugin verifyPluginStructure --console=plain
        working-directory: jetbrains
      # O IntelliJ de verdade (numa tela virtual) debuga exemplos de Java e grava o que o painel
      # desenhou; self-test.ts compara passo a passo com os snapshots do VS Code em test/fixtures/panel.
      - name: Autoteste no IntelliJ (comparado com o VS Code)
        working-directory: jetbrains
        run: |
          for t in BubbleSort:6:12 Dicionario:7:18 Pilha:6:7 Matriz:9:5; do
            timeout 900 xvfb-run -a ./gradlew runIde -PselfTest=$t --console=plain > "build/runIde-${t%%:*}.log" 2>&1 || true
            (cd .. && npx tsx jetbrains/self-test.ts "${t%%:*}")
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-self-test
          path: |
            jetbrains/build/self-test/*.json
            jetbrains/build/runIde-*.log
      - uses: actions/upload-artifact@v7
        with:
          name: code-scope-jetbrains
          path: jetbrains/build/distributions/*.zip

  minimum:
    name: Integração no VS Code 1.95
    # A versão mínima do engines, com o debugger de JavaScript que vem com o VS Code.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          CODE_SCOPE_GREP: JavaScript
          CODE_SCOPE_EXTENSIONS: ''
          CODE_SCOPE_VSCODE: 1.95.0
